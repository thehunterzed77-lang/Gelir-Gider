<script>

const SUPABASE_URL = "https://dvyitgovuciergwlbigj.supabase.co";

const SUPABASE_KEY = "sb_publishable_H_7LfiyftQEa_TIBMNItVg_cfWHV6Te";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let expenseChart = null;
let transactions = [];


/* EKRAN DEĞİŞTİRME */

function showLogin(){

    document.getElementById("registerScreen").classList.add("hidden");

    document.getElementById("appScreen").classList.add("hidden");

    document.getElementById("loginScreen").classList.remove("hidden");

    document.getElementById("loginMessage").textContent = "";

}


function showRegister(){

    document.getElementById("loginScreen").classList.add("hidden");

    document.getElementById("appScreen").classList.add("hidden");

    document.getElementById("registerScreen").classList.remove("hidden");

    document.getElementById("registerMessage").textContent = "";

}


/* ŞİFRE GÜCÜ */

function getPasswordStrength(password){

    let score = 0;

    if(password.length >= 6) score++;

    if(password.length >= 10) score++;

    if(/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;

    if(/[0-9]/.test(password)) score++;

    if(/[^A-Za-z0-9]/.test(password)) score++;

    return score;

}


function checkPassword(){

    const password = document.getElementById("registerPassword").value;

    const bar = document.getElementById("strengthBar");

    const text = document.getElementById("strengthText");

    const score = getPasswordStrength(password);

    if(password.length === 0){

        bar.style.width = "0%";
        text.textContent = "En az 6 karakter kullanın.";

        return;
    }

    if(score <= 1){

        bar.style.width = "25%";
        bar.style.background = "#dc2626";
        text.textContent = "Zayıf şifre";

    }else if(score <= 3){

        bar.style.width = "60%";
        bar.style.background = "#f59e0b";
        text.textContent = "Orta seviye şifre";

    }else{

        bar.style.width = "100%";
        bar.style.background = "#16a34a";
        text.textContent = "Güçlü şifre";

    }

    checkPasswordMatch();

}


function checkPasswordMatch(){

    const password =
        document.getElementById("registerPassword").value;

    const confirm =
        document.getElementById("passwordConfirm").value;

    const text =
        document.getElementById("matchText");

    if(confirm === ""){

        text.textContent = "";

        return;
    }

    if(password === confirm){

        text.textContent = "✓ Şifreler aynı";
        text.style.color = "#16a34a";

    }else{

        text.textContent = "✕ Şifreler eşleşmiyor";
        text.style.color = "#dc2626";

    }

}


/* KAYIT */

async function register(){

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    const email =
        document.getElementById("registerEmail").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const password =
        document.getElementById("registerPassword").value;

    const confirm =
        document.getElementById("passwordConfirm").value;

    const message =
        document.getElementById("registerMessage");


    message.style.color = "#dc2626";


    if(!firstName || !lastName || !email || !phone || !password || !confirm){

        message.textContent = "Lütfen tüm alanları doldurun.";

        return;
    }


    if(password.length < 6){

        message.textContent = "Şifre en az 6 karakter olmalı.";

        return;
    }


    if(password !== confirm){

        message.textContent = "Şifreler eşleşmiyor.";

        return;
    }


    if(getPasswordStrength(password) < 3){

        message.textContent =
            "Daha güçlü bir şifre kullanın.";

        return;
    }


    message.style.color = "#2563eb";

    message.textContent = "Hesap oluşturuluyor...";


    const {data,error} =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options:{
                data:{
                    first_name:firstName,
                    last_name:lastName,
                    phone:phone
                }
            }

        });


    if(error){

        message.style.color = "#dc2626";

        message.textContent = error.message;

        return;
    }


    if(!data.user){

        message.style.color = "#dc2626";

        message.textContent =
            "Hesap oluşturulamadı.";

        return;
    }


    /*
    Supabase'de Confirm Email kapalıysa
    session burada gelir.
    */

    if(!data.session){

        message.style.color = "#dc2626";

        message.textContent =
            "Hesap oluşturuldu ancak otomatik giriş yapılamadı. Supabase'de Confirm email seçeneğini kapatın.";

        return;
    }


    currentUser = data.user;

    message.style.color = "#16a34a";

    message.textContent =
        "Hesabınız oluşturuldu.";


    setTimeout(()=>{

        showApp(data.user);

    },500);

}


/* GİRİŞ */

async function login(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");


    message.textContent = "";


    if(!email || !password){

        message.textContent =
            "E-posta ve şifreyi girin.";

        return;
    }


    message.style.color = "#2563eb";

    message.textContent = "Giriş yapılıyor...";


    const {data,error} =
        await supabaseClient.auth.signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        message.style.color = "#dc2626";

        message.textContent = error.message;

        return;
    }


    currentUser = data.user;

    showApp(data.user);

}


/* UYGULAMAYI AÇ */

async function showApp(user){

    currentUser = user;


    document.getElementById("loginScreen")
        .classList.add("hidden");

    document.getElementById("registerScreen")
        .classList.add("hidden");

    document.getElementById("appScreen")
        .classList.remove("hidden");


    document.getElementById("transactionDate").value =
        new Date().toISOString().split("T")[0];


    const {data:profile} =
        await supabaseClient
        .from("profiles")
        .select("first_name,last_name")
        .eq("id",user.id)
        .maybeSingle();


    if(profile){

        document.getElementById("userName").textContent =
            `${profile.first_name} ${profile.last_name}`;

    }else{

        document.getElementById("userName").textContent =
            user.email;

    }


    loadTransactions();

}


/* SESSION */

async function checkSession(){

    const {data} =
        await supabaseClient.auth.getSession();


    if(data.session){

        showApp(data.session.user);

    }else{

        showLogin();

    }

}


/* ÇIKIŞ */

async function logout(){

    await supabaseClient.auth.signOut();

    currentUser = null;

    transactions = [];

    showLogin();

}


/* İŞLEM EKLE */

async function addTransaction(){

    const type =
        document.getElementById("transactionType").value;

    const category =
        document.getElementById("category").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const amount =
        parseFloat(document.getElementById("amount").value);

    const date =
        document.getElementById("transactionDate").value;

    const message =
        document.getElementById("transactionMessage");


    if(!category || !amount || amount <= 0 || !date){

        message.textContent =
            "Kategori, tutar ve tarih zorunludur.";

        return;
    }


    const {error} =
        await supabaseClient
        .from("transactions")
        .insert({

            user_id:currentUser.id,

            type:type,

            category:category,

            description:description,

            amount:amount,

            transaction_date:date

        });


    if(error){

        message.textContent =
            error.message;

        return;
    }


    message.style.color = "#16a34a";

    message.textContent =
        "İşlem eklendi.";


    document.getElementById("category").value = "";

    document.getElementById("description").value = "";

    document.getElementById("amount").value = "";


    loadTransactions();

}


/* İŞLEMLERİ YÜKLE */

async function loadTransactions(){

    if(!currentUser) return;


    let query =
        supabaseClient
        .from("transactions")
        .select("*")
        .eq("user_id",currentUser.id)
        .order("transaction_date",{ascending:false});


    const month =
        document.getElementById("monthFilter").value;


    if(month){

        const year =
            new Date().getFullYear();

        const start =
            `${year}-${month}-01`;

        let nextMonth =
            parseInt(month)+1;

        let nextYear = year;

        if(nextMonth === 13){

            nextMonth = 1;

            nextYear++;

        }

        const end =
            `${nextYear}-${String(nextMonth).padStart(2,"0")}-01`;


        query =
            query
            .gte("transaction_date",start)
            .lt("transaction_date",end);

    }


    const {data,error} =
        await query;


    if(error){

        console.error(error);

        return;
    }


    transactions = data || [];

    updateScreen();

}


/* EKRANI GÜNCELLE */

function updateScreen(){

    let income = 0;

    let expense = 0;


    transactions.forEach(t=>{

        if(t.type === "income"){

            income += Number(t.amount);

        }else{

            expense += Number(t.amount);

        }

    });


    document.getElementById("totalIncome").textContent =
        formatMoney(income);

    document.getElementById("totalExpense").textContent =
        formatMoney(expense);

    document.getElementById("balance").textContent =
        formatMoney(income-expense);


    const list =
        document.getElementById("transactionList");


    if(transactions.length === 0){

        list.innerHTML =
            `<div class="empty">Henüz işlem bulunmuyor.</div>`;

    }else{

        list.innerHTML =
            transactions.map(t=>`

                <div class="transaction">

                    <div class="transaction-left">

                        <div class="transaction-title">
                            ${escapeHtml(t.category)}
                        </div>

                        <div class="transaction-meta">
                            ${escapeHtml(t.description || "")}
                            •
                            ${formatDate(t.transaction_date)}
                        </div>

                    </div>

                    <div class="transaction-right">

                        <div class="transaction-amount ${t.type === "income" ? "income" : "expense"}">

                            ${t.type === "income" ? "+" : "-"}
                            ${formatMoney(Number(t.amount))}

                        </div>

                        <button
                            class="delete-btn"
                            onclick="deleteTransaction('${t.id}')">

                            Sil

                        </button>

                    </div>

                </div>

            `).join("");

    }


    updateChart();

}


/* SİL */

async function deleteTransaction(id){

    if(!confirm("Bu işlemi silmek istediğinize emin misiniz?")){

        return;

    }


    const {error} =
        await supabaseClient
        .from("transactions")
        .delete()
        .eq("id",id)
        .eq("user_id",currentUser.id);


    if(error){

        alert(error.message);

        return;
    }


    loadTransactions();

}


/* GRAFİK */

function updateChart(){

    const expenses =
        transactions.filter(t=>t.type === "expense");


    const categories = {};

    expenses.forEach(t=>{

        if(!categories[t.category]){

            categories[t.category] = 0;

        }

        categories[t.category] += Number(t.amount);

    });


    const labels =
        Object.keys(categories);

    const values =
        Object.values(categories);


    const ctx =
        document.getElementById("expenseChart");


    if(expenseChart){

        expenseChart.destroy();

    }


    expenseChart =
        new Chart(ctx,{

            type:"doughnut",

            data:{

                labels:labels,

                datasets:[{

                    data:values

                }]

            },

            options:{

                responsive:true,

                maintainAspectRatio:false,

                plugins:{

                    legend:{

                        position:"bottom"

                    }

                }

            }

        });

}


/* PARA */

function formatMoney(value){

    return new Intl.NumberFormat("tr-TR",{

        style:"currency",

        currency:"TRY"

    }).format(value);

}


/* TARİH */

function formatDate(date){

    if(!date) return "";

    const parts =
        date.split("-");

    return `${parts[2]}.${parts[1]}.${parts[0]}`;

}


/* HTML GÜVENLİĞİ */

function escapeHtml(text){

    if(!text) return "";

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
