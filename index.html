```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gelir Gider Takip</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.header {
    background: #111;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 1000px;
    margin: 25px auto;
    padding: 15px;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

.income {
    color: #159447;
}

.expense {
    color: #d93636;
}

.balance {
    color: #2864d7;
}

.form,
.transactions {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    background: #111;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #333;
}

.transaction {
    display: grid;
    grid-template-columns: 1fr 120px 120px 70px;
    gap: 10px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #eee;
}

.transaction:last-child {
    border-bottom: none;
}

.amount-income {
    color: #159447;
    font-weight: bold;
}

.amount-expense {
    color: #d93636;
    font-weight: bold;
}

.delete {
    background: #d93636;
    margin: 0;
    padding: 7px;
    font-size: 13px;
}

.clear {
    background: #555;
}

@media (max-width: 700px) {

    .summary {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .transaction {
        grid-template-columns: 1fr;
        gap: 5px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>💰 Gelir Gider Takip</h1>
</div>

<div class="container">

    <!-- ÖZET -->

    <div class="summary">

        <div class="box">
            <h3>Toplam Gelir</h3>
            <h2 class="income" id="totalIncome">₺0,00</h2>
        </div>

        <div class="box">
            <h3>Toplam Gider</h3>
            <h2 class="expense" id="totalExpense">₺0,00</h2>
        </div>

        <div class="box">
            <h3>Kalan Bakiye</h3>
            <h2 class="balance" id="balance">₺0,00</h2>
        </div>

    </div>


    <!-- YENİ İŞLEM -->

    <div class="form">

        <h2>➕ Yeni İşlem Ekle</h2>

        <div class="form-grid">

            <select id="type">
                <option value="income">Gelir</option>
                <option value="expense">Gider</option>
            </select>

            <select id="category">

                <option value="Maaş">Maaş</option>
                <option value="Ek Gelir">Ek Gelir</option>
                <option value="Fatura">Fatura</option>
                <option value="Market">Market</option>
                <option value="Yakıt">Yakıt</option>
                <option value="Kira">Kira</option>
                <option value="Alışveriş">Alışveriş</option>
                <option value="Eğlence">Eğlence</option>
                <option value="Ulaşım">Ulaşım</option>
                <option value="Diğer">Diğer</option>

            </select>

            <input
                type="text"
                id="description"
                placeholder="Açıklama"
            >

            <input
                type="number"
                id="amount"
                placeholder="Tutar"
                step="0.01"
            >

            <input
                type="date"
                id="date"
            >

        </div>

        <button onclick="addTransaction()">
            İşlemi Ekle
        </button>

    </div>


    <!-- AY FİLTRESİ -->

    <div class="form">

        <h2>📅 Ay Filtrele</h2>

        <input
            type="month"
            id="monthFilter"
            onchange="updateScreen()"
        >

        <button
            class="clear"
            onclick="clearFilter()"
        >
            Tüm İşlemleri Göster
        </button>

    </div>


    <!-- İŞLEMLER -->

    <div class="transactions">

        <h2>📋 İşlemler</h2>

        <div id="transactionList">
            <p>Henüz işlem eklenmedi.</p>
        </div>

    </div>

</div>


<script>

let transactions =
    JSON.parse(localStorage.getItem("transactions")) || [];


/* BUGÜNÜ TARİH OLARAK SEÇ */

document.getElementById("date").value =
    new Date().toISOString().split("T")[0];


/* İŞLEM EKLE */

function addTransaction() {

    const type =
        document.getElementById("type").value;

    const category =
        document.getElementById("category").value;

    const description =
        document.getElementById("description").value.trim();

    const amount =
        parseFloat(
            document.getElementById("amount").value
        );

    const date =
        document.getElementById("date").value;


    if (
        !description ||
        !amount ||
        amount <= 0 ||
        !date
    ) {

        alert("Lütfen tüm alanları doldur.");

        return;
    }


    const transaction = {

        id: Date.now(),

        type: type,

        category: category,

        description: description,

        amount: amount,

        date: date

    };


    transactions.push(transaction);


    saveData();


    document.getElementById("description").value = "";

    document.getElementById("amount").value = "";


    updateScreen();

}


/* İŞLEM SİL */

function deleteTransaction(id) {

    transactions =
        transactions.filter(
            item => item.id !== id
        );


    saveData();

    updateScreen();

}


/* VERİLERİ KAYDET */

function saveData() {

    localStorage.setItem(
        "transactions",
        JSON.stringify(transactions)
    );

}


/* TARİHİ GÖRÜNÜME ÇEVİR */

function formatDate(date) {

    const parts = date.split("-");

    return (
        parts[2] +
        "." +
        parts[1] +
        "." +
        parts[0]
    );

}


/* EKRANI GÜNCELLE */

function updateScreen() {

    let totalIncome = 0;

    let totalExpense = 0;


    const selectedMonth =
        document.getElementById(
            "monthFilter"
        ).value;


    let filteredTransactions =
        transactions;


    /* AY FİLTRESİ */

    if (selectedMonth) {

        filteredTransactions =
            transactions.filter(
                item =>
                    item.date.startsWith(
                        selectedMonth
                    )
            );

    }


    /* YENİDEN ESKİYE SIRALA */

    filteredTransactions =
        [...filteredTransactions].sort(
            (a, b) =>
                b.date.localeCompare(a.date)
        );


    const list =
        document.getElementById(
            "transactionList"
        );


    list.innerHTML = "";


    /* İŞLEMLERİ GÖSTER */

    filteredTransactions.forEach(
        transaction => {


            if (
                transaction.type === "income"
            ) {

                totalIncome +=
                    transaction.amount;

            } else {

                totalExpense +=
                    transaction.amount;

            }


            const div =
                document.createElement("div");


            div.className =
                "transaction";


            div.innerHTML = `

                <div>

                    <strong>
                        ${transaction.description}
                    </strong>

                    <br>

                    <small>
                        ${transaction.category}
                    </small>

                </div>


                <div>

                    ${formatDate(
                        transaction.date
                    )}

                </div>


                <div class="${
                    transaction.type === "income"
                    ? "amount-income"
                    : "amount-expense"
                }">

                    ${
                        transaction.type === "income"
                        ? "+"
                        : "-"
                    }

                    ₺${transaction.amount.toFixed(2)}

                </div>


                <button
                    class="delete"
                    onclick="deleteTransaction(
                        ${transaction.id}
                    )"
                >

                    Sil

                </button>

            `;


            list.appendChild(div);

        }
    );


    /* İŞLEM YOKSA */

    if (
        filteredTransactions.length === 0
    ) {

        list.innerHTML =
            "<p>Bu dönemde işlem bulunamadı.</p>";

    }


    /* TOPLAMLAR */

    document.getElementById(
        "totalIncome"
    ).textContent =
        "₺" +
        totalIncome.toFixed(2);


    document.getElementById(
        "totalExpense"
    ).textContent =
        "₺" +
        totalExpense.toFixed(2);


    document.getElementById(
        "balance"
    ).textContent =
        "₺" +
        (
            totalIncome -
            totalExpense
        ).toFixed(2);

}


/* FİLTREYİ TEMİZLE */

function clearFilter() {

    document.getElementById(
        "monthFilter"
    ).value = "";

    updateScreen();

}


/* BAŞLANGIÇ */

updateScreen();

</script>

</body>
</html>
```
