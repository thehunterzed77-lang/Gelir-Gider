<body>

>

</button>

<script>

const SUPABASE_URL=
"https://dvyitgovuciergwlbigj.supabase.co";

const SUPABASE_KEY=
"sb_publishable_H_7LfiyftQEa_TIBMNItVg_cfWHV6Te";

const supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let financeChart=null;


document.getElementById("date").value=
new Date().toISOString().split("T")[0];


function showLogin(){

document.getElementById(
"registerScreen"
).classList.add("hidden");

document.getElementById(
"appScreen"
).classList.add("hidden");

document.getElementById(
"loginScreen"
).classList.remove("hidden");

}


function showRegister(){

document.getElementById(
"loginScreen"
).classList.add("hidden");

document.getElementById(
"registerScreen"
).classList.remove("hidden");

document.getElementById(
"loginMessage"
).textContent="";

}


function getPasswordStrength(password){

let score=0;

if(password.length>=6)score++;

if(password.length>=10)score++;

if(/[a-z]/.test(password)&&/[A-Z]/.test(password))
score++;

if(/[0-9]/.test(password))
score++;

if(/[^A-Za-z0-9]/.test(password))
score++;

return score;

}


function checkPasswordStrength(){

const password=
document.getElementById(
"registerPassword"
).value;

const element=
document.getElementById(
"passwordStrength"
);

if(!password){

element.textContent="";
return;

}

const score=
getPasswordStrength(password);

if(score<=1){

element.textContent=
"🔴 Şifre güvenliği: Zayıf";

element.style.color="#d93636";

}

else if(score<=3){

element.textContent=
"🟠 Şifre güvenliği: Orta";

element.style.color="#e68a00";

}

else{

element.textContent=
"🟢 Şifre güvenliği: Güçlü";

element.style.color="#159447";

}

checkPasswordMatch();

}


function checkPasswordMatch(){

const password=
document.getElementById(
"registerPassword"
).value;

const confirmPassword=
document.getElementById(
"passwordConfirm"
).value;

const element=
document.getElementById(
"passwordMatch"
);

if(!confirmPassword){

element.textContent="";
return;

}

if(password===confirmPassword){

element.textContent=
"🟢 Şifreler eşleşiyor";

element.style.color="#159447";

}

else{

element.textContent=
"🔴 Şifreler eşleşmiyor";

element.style.color="#d93636";

}

}


async function register(){

const firstName=
document.getElementById(
"firstName"
).value.trim();

const lastName=
document.getElementById(
"lastName"
).value.trim();

const email=
document.getElementById(
"registerEmail"
).value.trim();

const phone=
document.getElementById(
"phone"
).value.trim();

const password=
document.getElementById(
"registerPassword"
).value;

const confirmPassword=
document.getElementById(
"passwordConfirm"
).value;


if(
!firstName||
!lastName||
!email||
!phone||
!password||
!confirmPassword
){

return showRegisterMessage(
"Lütfen tüm alanları doldur."
);

}


if(password.length<6){

return showRegisterMessage(
"Şifre en az 6 karakter olmalı."
);

}


if(password!==confirmPassword){

return showRegisterMessage(
"Şifreler eşleşmiyor."
);

}


if(getPasswordStrength(password)<3){

return showRegisterMessage(
"Lütfen daha güçlü bir şifre oluştur."
);

}


const{data,error}=
await supabaseClient.auth.signUp({

email:email,

password:password,

});


if(error){

return showRegisterMessage(
error.message
);

}


if(!data.user){

return showRegisterMessage(
"Hesap oluşturulamadı."
);

}


const{error:profileError}=
await supabaseClient
.from("profiles")
.insert({

id:data.user.id,

first_name:firstName,

last_name:lastName,

phone:phone

});


if(profileError){

return showRegisterMessage(
"Profil oluşturulamadı: "+
profileError.message
);

}


showApp(data.user);

}


async function login(){

const email=
document.getElementById(
"loginEmail"
).value.trim();

const password=
document.getElementById(
"loginPassword"
).value;


if(!email||!password){

return showLoginMessage(
"E-posta ve şifre gir."
);

}


const{data,error}=
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(error){

return showLoginMessage(
error.message
);

}


showApp(data.user);

}


async function showApp(user){

document.getElementById(
"loginScreen"
).classList.add("hidden");

document.getElementById(
"registerScreen"
).classList.add("hidden");

document.getElementById(
"appScreen"
).classList.remove("hidden");


document.getElementById(
"userEmail"
).textContent=
user.email;


const{data:profile}=
await supabaseClient
.from("profiles")
.select("first_name,last_name")
.eq("id",user.id)
.maybeSingle();


if(profile){

document.getElementById(
"userName"
).textContent=
profile.first_name+
" "+
profile.last_name;

}


loadTransactions();

}


async function checkSession(){

const{data}=
await supabaseClient.auth.getSession();


if(data.session){

showApp(
data.session.user
);

}

}


async function logout(){

await supabaseClient.auth.signOut();


document.getElementById(
"appScreen"
).classList.add("hidden");

showLogin();


document.getElementById(
"loginEmail"
).value="";

document.getElementById(
"loginPassword"
).value="";

}


function showLoginMessage(text){

const element=
document.getElementById(
"loginMessage"
);

element.textContent=text;

element.style.color="#d93636";

}


function showRegisterMessage(text){

const element=
document.getElementById(
"registerMessage"
);

element.textContent=text;

element.style.color="#d93636";

}


async function addTransaction(){

const{data}=
await supabaseClient.auth.getUser();

const user=data.user;


if(!user){

return alert(
"Önce giriş yapmalısın."
);

}


const type=
document.getElementById(
"type"
).value;

const category=
document.getElementById(
"category"
).value;

const description=
document.getElementById(
"description"
).value.trim();

const amount=
parseFloat(
document.getElementById(
"amount"
).value
);

const date=
document.getElementById(
"date"
).value;


if(
!description||
!amount||
amount<=0||
!date
){

return alert(
"Lütfen tüm alanları doldur."
);

}


const{error}=
await supabaseClient
.from("transactions")
.insert({

user_id:user.id,

type:type,

category:category,

description:description,

amount:amount,

transaction_date:date

});


if(error){

return alert(
"Kayıt eklenemedi: "+
error.message
);

}


document.getElementById(
"description"
).value="";

document.getElementById(
"amount"
).value="";


loadTransactions();

}


async function loadTransactions(){

const{data:userData}=
await supabaseClient.auth.getUser();

const user=userData.user;


if(!user)return;


const selectedMonth=
document.getElementById(
"monthFilter"
).value;


let query=
supabaseClient
.from("transactions")
.select("*")
.eq("user_id",user.id)
.order(
"transaction_date",
{ascending:false}
);


if(selectedMonth){

const parts=
selectedMonth.split("-");

const year=
Number(parts[0]);

const month=
Number(parts[1]);

const startDate=
`${year}-${String(month).padStart(2,"0")}-01`;

const nextYear=
month===12
?year+1
:year;

const nextMonth=
month===12
?1
:month+1;

const endDate=
`${nextYear}-${String(nextMonth).padStart(2,"0")}-01`;

query=
query
.gte("transaction_date",startDate)
.lt("transaction_date",endDate);

}


const{data,error}=
await query;


if(error){

return alert(
"Veriler alınamadı: "+
error.message
);

}


updateScreen(data||[]);

}


function updateScreen(transactions){

let totalIncome=0;

let totalExpense=0;

const list=
document.getElementById(
"transactionList"
);

list.innerHTML="";


transactions.forEach(
transaction=>{

const amount=
Number(transaction.amount);


if(transaction.type==="income")
totalIncome+=amount;

else
totalExpense+=amount;


const div=
document.createElement("div");

div.className="transaction";


div.innerHTML=`

<div>

<strong>
${escapeHtml(
transaction.description
)}
</strong>

<br>

<small>
${escapeHtml(
transaction.category
)}
</small>

</div>

<div>
${formatDate(
transaction.transaction_date
)}
</div>

<div class="${
transaction.type==="income"
?"amount-income"
:"amount-expense"
}">

${
transaction.type==="income"
?"+"
:"-"
}₺${
amount.toLocaleString(
"tr-TR",
{
minimumFractionDigits:2
}
)
}

</div>

<button
class="delete"
onclick="deleteTransaction('${transaction.id}')">

Sil

</button>

`;


list.appendChild(div);

});


if(transactions.length===0){

list.innerHTML=
"<p>Bu dönemde işlem bulunamadı.</p>";

}


document.getElementById(
"totalIncome"
).textContent=
"₺"+
totalIncome.toLocaleString(
"tr-TR",
{
minimumFractionDigits:2
}
);


document.getElementById(
"totalExpense"
).textContent=
"₺"+
totalExpense.toLocaleString(
"tr-TR",
{
minimumFractionDigits:2
}
);


document.getElementById(
"balance"
).textContent=
"₺"+
(
totalIncome-totalExpense
).toLocaleString(
"tr-TR",
{
minimumFractionDigits:2
}
);


updateChart(
totalIncome,
totalExpense
);

}


async function deleteTransaction(id){

if(!confirm(
"Bu işlemi silmek istediğine emin misin?"
))return;


const{error}=
await supabaseClient
.from("transactions")
.delete()
.eq("id",id);


if(error){

return alert(
"Silinemedi: "+
error.message
);

}


loadTransactions();

}


function clearFilter(){

document.getElementById(
"monthFilter"
).value="";

loadTransactions();

}


function formatDate(date){

const parts=
date.split("-");

return parts[2]+
"."+
parts[1]+
"."+
parts[0];

}


function updateChart(
income,
expense
){

const canvas=
document.getElementById(
"financeChart"
);


if(financeChart)
financeChart.destroy();


financeChart=
new Chart(
canvas,
{

type:"doughnut",

data:{

labels:[
"Gelir",
"Gider"
],

datasets:[
{
data:[
income,
expense
]
}
]

},

options:{

responsive:true,

plugins:{
legend:{
position:"bottom"
}

}

}

}
);

}


function escapeHtml(text){

const div=
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}


checkSession();

</script>

</body>
</html>
