```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gelir Gider Takip</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.header {
    background: #111;
    color: white;
    padding: 22px;
    text-align: center;
}

.container {
    max-width: 1000px;
    margin: 25px auto;
    padding: 15px;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.box {
    background: white;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.box h3 {
    margin-top: 0;
}

.income {
    color: #159447;
}

.expense {
    color: #d93636;
}

.balance {
    color: #2864d7;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    border: none;
    border-radius: 9px;
    background: #111;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #333;
}

.clear-button {
    background: #666;
}

.transaction {
    display: grid;
    grid-template-columns: 1fr 120px 120px 70px;
    gap: 10px;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.transaction:last-child {
    border-bottom: none;
}

.amount-income {
    color: #159447;
    font-weight: bold;
}

.amount-expense {
    color: #d93636;
    font-weight: bold;
}

.delete-button {
    background: #d93636;
    margin: 0;
    padding: 8px;
    font-size: 13px;
}

.chart-container {
    max-width: 450px;
    margin: auto;
}

.empty {
    color: #777;
    text-align: center;
}

@media (max-width: 700px) {

    .summary {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .transaction {
        grid-template-columns: 1fr;
        gap: 6px;
    }

}

</style>
</head>

<body>

<div class="header">
    <h1>💰 Gelir Gider Takip</h1>
    <p>Paranı kontrol altında tut</p>
</div>

<div class="container">

    <!-- ÖZET -->

    <div class="summary">

        <div class="box">
            <h3>Toplam Gelir</h3>
            <h2 class="income" id="totalIncome">₺0,00</h2>
        </div>

        <div class="box">
            <h3>Toplam Gider</h3>
            <h2 class="expense" id="totalExpense">₺0,00</h2>
        </div>

        <div class="box">
            <h3>Kalan Bakiye</h3>
            <h2 class="balance" id="balance">₺0,00</h2>
        </div>

    </div>


    <!-- İŞLEM EKLE -->

    <div class="card">

        <h2>➕ Yeni İşlem Ekle</h2>

        <div class="form-grid">

            <select id="type">

                <option value="income">
                    Gelir
                </option>

                <option value="expense">
                    Gider
                </option>

            </select>


            <select id="category">

                <option value="Maaş">Maaş</option>
                <option value="Ek Gelir">Ek Gelir</option>
                <option value="Fatura">Fatura</option>
                <option value="Market">Market</option>
                <option value="Kira">Kira</option>
                <option value="Yakıt">Yakıt</option>
                <option value="Alışveriş">Alışveriş</option>
                <option value="Ulaşım">Ulaşım</option>
                <option value="Eğlence">Eğlence</option>
                <option value="Sağlık">Sağlık</option>
                <option value="Diğer">Diğer</option>

            </select>


            <input
                type="text"
                id="description"
                placeholder="Açıklama"
            >


            <input
                type="number"
                id="amount"
                placeholder="Tutar"
                step="0.01"
            >


            <input
                type="date"
                id="date"
            >

        </div>


        <button onclick="addTransaction()">
            İşlemi Ekle
        </button>

    </div>


    <!-- AY FİLTRESİ -->

    <div class="card">

        <h2>📅 Ay Filtrele</h2>

        <input
            type="month"
            id="monthFilter"
            onchange="updateScreen()"
        >

        <button
            class="clear-button"
            onclick="clearFilter()"
        >
            Tüm İşlemleri Göster
        </button>

    </div>


    <!-- GRAFİK -->

    <div class="card">

        <h2>📊 Gelir - Gider</h2>

        <div class="chart-container">

            <canvas id="financeChart"></canvas>

        </div>

    </div>


    <!-- İŞLEMLER -->

    <div class="card">

        <h2>📋 İşlemler</h2>

        <div id="transactionList">

            <p class="empty">
                Henüz işlem eklenmedi.
            </p>

        </div>

    </div>

</div>


<script>

/* VERİLER */

let transactions =
    JSON.parse(
        localStorage.getItem("transactions")
    ) || [];


/* TARİH */

document.getElementById("date").value =
    new Date()
        .toISOString()
        .split("T")[0];


/* GRAFİK */

let financeChart = null;


function updateChart(income, expense) {

    const canvas =
        document.getElementById(
            "financeChart"
        );

    if (financeChart) {

        financeChart.destroy();

    }


    financeChart =
        new Chart(canvas, {

            type: "doughnut",

            data: {

                labels: [
                    "Gelir",
                    "Gider"
                ],

                datasets: [

                    {

                        data: [
                            income,
                            expense
                        ]

                    }

                ]

            },

            options: {

                responsive: true,

                plugins: {

                    legend: {

                        position: "bottom"

                    }

                }

            }

        });

}


/* İŞLEM EKLE */

function addTransaction() {

    const type =
        document.getElementById(
            "type"
        ).value;


    const category =
        document.getElementById(
            "category"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    const amount =
        parseFloat(
            document.getElementById(
                "amount"
            ).value
        );


    const date =
        document.getElementById(
            "date"
        ).value;


    if (
        !description ||
        !amount ||
        amount <= 0 ||
        !date
    ) {

        alert(
            "Lütfen açıklama, tutar ve tarih gir."
        );

        return;

    }


    transactions.push({

        id: Date.now(),

        type: type,

        category: category,

        description: description,

        amount: amount,

        date: date

    });


    saveData();


    document.getElementById(
        "description"
    ).value = "";


    document.getElementById(
        "amount"
    ).value = "";


    updateScreen();

}


/* SİL */

function deleteTransaction(id) {

    transactions =
        transactions.filter(
            item => item.id !== id
        );


    saveData();

    updateScreen();

}


/* KAYDET */

function saveData() {

    localStorage.setItem(
        "transactions",
        JSON.stringify(
            transactions
        )
    );

}


/* TARİH */

function formatDate(date) {

    const parts =
        date.split("-");


    return (
        parts[2] +
        "." +
        parts[1] +
        "." +
        parts[0]
    );

}


/* EKRANI GÜNCELLE */

function updateScreen() {

    const selectedMonth =
        document.getElementById(
            "monthFilter"
        ).value;


    let filtered =
        transactions;


    if (selectedMonth) {

        filtered =
            transactions.filter(
                item =>
                    item.date.startsWith(
                        selectedMonth
                    )
            );

    }


    filtered =
        [...filtered].sort(
            (a, b) =>
                b.date.localeCompare(
                    a.date
                )
        );


    let totalIncome = 0;

    let totalExpense = 0;


    const list =
        document.getElementById(
            "transactionList"
        );


    list.innerHTML = "";


    filtered.forEach(
        transaction => {


            if (
                transaction.type ===
                "income"
            ) {

                totalIncome +=
                    transaction.amount;

            }

            else {

                totalExpense +=
                    transaction.amount;

            }


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "transaction";


            div.innerHTML = `

                <div>

                    <strong>
                        ${transaction.description}
                    </strong>

                    <br>

                    <small>
                        ${transaction.category}
                    </small>

                </div>


                <div>

                    ${formatDate(
                        transaction.date
                    )}

                </div>


                <div class="${
                    transaction.type ===
                    "income"
                    ? "amount-income"
                    : "amount-expense"
                }">

                    ${
                        transaction.type ===
                        "income"
                        ? "+"
                        : "-"
                    }

                    ₺${transaction.amount.toFixed(2)}

                </div>


                <button
                    class="delete-button"
                    onclick="deleteTransaction(
                        ${transaction.id}
                    )"
                >

                    Sil

                </button>

            `;


            list.appendChild(div);

        }
    );


    if (
        filtered.length === 0
    ) {

        list.innerHTML = `

            <p class="empty">
                Bu dönemde işlem bulunamadı.
            </p>

        `;

    }


    document.getElementById(
        "totalIncome"
    ).textContent =
        "₺" +
        totalIncome.toLocaleString(
            "tr-TR",
            {
                minimumFractionDigits: 2
            }
        );


    document.getElementById(
        "totalExpense"
    ).textContent =
        "₺" +
        totalExpense.toLocaleString(
            "tr-TR",
            {
                minimumFractionDigits: 2
            }
        );


    document.getElementById(
        "balance"
    ).textContent =
        "₺" +
        (
            totalIncome -
            totalExpense
        ).toLocaleString(
            "tr-TR",
            {
                minimumFractionDigits: 2
            }
        );


    updateChart(
        totalIncome,
        totalExpense
    );

}


/* FİLTRE TEMİZLE */

function clearFilter() {

    document.getElementById(
        "monthFilter"
    ).value = "";


    updateScreen();

}


/* BAŞLAT */

updateScreen();

</script>

</body>
</html>
```
